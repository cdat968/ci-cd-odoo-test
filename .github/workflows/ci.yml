name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, '18.0']

permissions:
  contents: read
  pull-requests: write

jobs:
  test-odoo:
    name: Odoo Module Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Pull Docker images
        run: |
          START_TS=$(date +%s)
          docker compose -f docker-compose.test.yml pull
          END_TS=$(date +%s)
          echo "Docker image pull took $((END_TS - START_TS))s"

      - name: Verify vendored OCA Helpdesk addons
        run: |
          python scripts/verify_oca_helpdesk_vendor.py

      - name: Init CI test logs
        run: |
          mkdir -p /tmp/ci-logs /tmp/ci-exit
          : > /tmp/ci_odoo_tests.log

      - name: Run OCA Helpdesk smoke tests
        run: |
          set -o pipefail
          START_TS=$(date +%s)
          set +e
          bash scripts/run_oca_helpdesk_smoke_tests.sh 2>&1 | tee /tmp/oca_helpdesk_smoke.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          END_TS=$(date +%s)
          echo "OCA Helpdesk smoke tests step took $((END_TS - START_TS))s"
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "=== docker compose logs: odoo_helpdesk_smoke ===" >> /tmp/oca_helpdesk_smoke.log
            docker compose -f docker-compose.test.yml logs odoo_helpdesk_smoke >> /tmp/oca_helpdesk_smoke.log 2>&1 || true
          fi
          cp /tmp/oca_helpdesk_smoke.log /tmp/ci-logs/oca_helpdesk_smoke.log
          echo "$TEST_EXIT" > /tmp/ci-exit/oca_helpdesk_smoke.exit
          {
            echo "===== OCA Helpdesk smoke tests ====="
            cat /tmp/oca_helpdesk_smoke.log
          } >> /tmp/ci_odoo_tests.log
          exit 0

      - name: Run QA Helpdesk bridge tests
        run: |
          set -o pipefail
          START_TS=$(date +%s)
          set +e
          bash scripts/run_qa_helpdesk_bridge_tests.sh 2>&1 | tee /tmp/qa_helpdesk_bridge.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          END_TS=$(date +%s)
          echo "QA Helpdesk bridge tests step took $((END_TS - START_TS))s"
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "=== docker compose logs: odoo_helpdesk_bridge ===" >> /tmp/qa_helpdesk_bridge.log
            docker compose -f docker-compose.test.yml logs odoo_helpdesk_bridge >> /tmp/qa_helpdesk_bridge.log 2>&1 || true
          fi
          cp /tmp/qa_helpdesk_bridge.log /tmp/ci-logs/qa_helpdesk_bridge.log
          echo "$TEST_EXIT" > /tmp/ci-exit/qa_helpdesk_bridge.exit
          {
            echo "===== QA Helpdesk bridge tests ====="
            cat /tmp/qa_helpdesk_bridge.log
          } >> /tmp/ci_odoo_tests.log
          exit 0

      - name: Run Odoo tests
        run: |
          set -o pipefail
          START_TS=$(date +%s)
          set +e
          bash scripts/run_odoo_tests.sh 2>&1 | tee /tmp/odoo_test.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          END_TS=$(date +%s)
          echo "Run Odoo tests step took $((END_TS - START_TS))s"
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "=== docker compose logs: odoo ===" >> /tmp/odoo_test.log
            docker compose -f docker-compose.test.yml logs odoo >> /tmp/odoo_test.log 2>&1 || true
          fi
          cp /tmp/odoo_test.log /tmp/ci-logs/odoo_test.log
          echo "$TEST_EXIT" > /tmp/ci-exit/odoo_test.exit
          {
            echo "===== Odoo module tests ====="
            cat /tmp/odoo_test.log
          } >> /tmp/ci_odoo_tests.log
          exit 0

      - name: Collect test failures
        if: always()
        id: collect_failures
        run: |
          echo "=== LAST 120 LINES OF COMBINED ODOO TEST LOG ==="
          tail -120 /tmp/ci_odoo_tests.log || true
          python scripts/collect_ci_failures.py \
            --step "OCA Helpdesk smoke tests::/tmp/ci-logs/oca_helpdesk_smoke.log::/tmp/ci-exit/oca_helpdesk_smoke.exit" \
            --step "QA Helpdesk bridge tests::/tmp/ci-logs/qa_helpdesk_bridge.log::/tmp/ci-exit/qa_helpdesk_bridge.exit" \
            --step "Odoo module tests::/tmp/ci-logs/odoo_test.log::/tmp/ci-exit/odoo_test.exit" \
            > /tmp/failures.json
          FAILED=$(python -c "import json; print('true' if json.load(open('/tmp/failures.json')).get('failed', 0) else 'false')")
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          echo "=== PARSE RESULT ==="
          cat /tmp/failures.json

      - name: Upload report to Odoo
        if: always() && steps.collect_failures.outputs.failed == 'true'
        continue-on-error: true
        id: upload_report
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          QA_CI_KEY: ${{ secrets.QA_CI_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          GITHUB_PR_URL: ${{ github.event.pull_request.html_url || '' }}
        run: |
          pip install requests cloudinary
          SHARE_URL=$(python scripts/upload_report.py \
            --html bug_report_landingPage/bug_report_landingPage.html \
            --title "CI Report — ${{ github.ref_name }} @ ${{ github.sha }}" \
            --report-dir bug_report_landingPage \
            --created-by "ci-bot") || true
          echo "SHARE_URL=${SHARE_URL}" >> $GITHUB_ENV

      - name: Report failures to Odoo
        if: always() && steps.collect_failures.outputs.failed == 'true'
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          QA_CI_KEY: ${{ secrets.QA_CI_KEY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          GITHUB_PR_URL: ${{ github.event.pull_request.html_url || '' }}
        run: |
          pip install requests
          python scripts/report_ci_failure.py \
            --failures-json /tmp/failures.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --report-url "${SHARE_URL:-}" \
            --github-actor "${GITHUB_ACTOR}" \
            --github-pr-author "${GITHUB_PR_AUTHOR}" \
            --github-pr-url "${GITHUB_PR_URL}" \
            --created-output /tmp/created_ci_bugs.txt

      - name: Comment on failed PR
        if: always() && steps.collect_failures.outputs.failed == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SHARE_URL: ${{ env.SHARE_URL }}
        with:
          script: |
            const fs = require('fs');
            const failures = JSON.parse(fs.readFileSync('/tmp/failures.json', 'utf8'));
            let created = '';
            try {
              created = fs.readFileSync('/tmp/created_ci_bugs.txt', 'utf8').trim();
            } catch (e) {}
            const actor = context.payload.pull_request.user.login || context.actor;
            const reportUrl = process.env.SHARE_URL || '';
            const failureLines = (failures.failures || [])
              .slice(0, 5)
              .map((failure) => `- ${failure.step || 'CI'}: ${failure.module}.${failure.test}`)
              .join('\n');
            const body = [
              `@${actor} CI failed for this pull request.`,
              '',
              failureLines || '- CI failed, but no structured failures were parsed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              reportUrl ? `Report: ${reportUrl}` : '',
              created ? `Odoo bugs:\n\`\`\`\n${created}\n\`\`\`` : '',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job if tests failed
        if: always() && steps.collect_failures.outputs.failed == 'true'
        run: exit 1

  test-webapp:
    name: Next.js Webapp Health Check
    runs-on: ubuntu-latest
    if: vars.COMPONENT_A_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4

      - name: Health check
        run: |
          curl -f "${{ vars.COMPONENT_A_BASE_URL }}/api/health" \
            || (echo "Webapp health check failed" && exit 1)

      - name: Smoke test — create + patch report
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          QA_CI_KEY: ${{ secrets.QA_CI_KEY }}
          BASE_URL: ${{ vars.COMPONENT_A_BASE_URL }}
        run: |
          pip install requests
          python scripts/smoke_test_webapp.py

  lint-check:
    name: Quick Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and type-check webapp
        working-directory: webapp
        run: npm ci && npx tsc --noEmit
