version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: ci_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./qa_bug_management:/mnt/extra-addons/qa_bug_management:ro
    command: >
      odoo
      --db_host=db --db_user=odoo --db_password=odoo
      -d ci_test
      -i qa_bug_management
      --test-enable
      --test-tags qa_bug_management
      --stop-after-init
      --log-level=test
      --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
