<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TechNext Landing Page Bug Report - BUG-1 and BUG-2</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #5f6b7a;
        --line: #d8e0eb;
        --paper: #fff;
        --bg: #f5f7fb;
        --navy: #173b63;
        --green: #15803d;
        --red: #b91c1c;
        --orange: #c2410c;
        --blue: #2454d6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.5;
      }
      .page { max-width: 1280px; margin: 0 auto; padding: 28px 20px 56px; }
      .hero {
        background: var(--navy);
        color: white;
        padding: 30px;
        border-radius: 8px;
        border: 1px solid #0f2d4f;
      }
      .hero h1 { margin: 0 0 10px; font-size: 32px; line-height: 1.15; letter-spacing: 0; }
      .hero p { margin: 0; color: #dce9f8; max-width: 960px; }
      .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
      .kpi { background: white; color: var(--ink); border-radius: 8px; padding: 14px; border: 1px solid var(--line); }
      .kpi strong { display: block; font-size: 28px; line-height: 1; }
      .kpi span { color: var(--muted); font-size: 13px; }
      nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
      nav a { color: #dce9f8; text-decoration: none; border: 1px solid rgba(255,255,255,.35); padding: 7px 10px; border-radius: 8px; font-size: 13px; }
      section { margin-top: 22px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .section-head { padding: 18px 20px; border-bottom: 1px solid var(--line); background: #fbfcfe; }
      .section-head h2 { margin: 0; font-size: 20px; letter-spacing: 0; }
      .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
      .section-body { padding: 18px 20px 22px; }
      .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
      table { width: 100%; border-collapse: collapse; min-width: 1180px; background: white; }
      th, td { padding: 10px 11px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; font-size: 13px; }
      th { background: #eef3f8; color: #344054; text-transform: uppercase; font-size: 12px; letter-spacing: .03em; }
      tbody tr:nth-child(even) td { background: #eef6ff; }
      tbody tr:nth-child(odd) td { background: #fff; }
      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 8px;
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 800;
        border: 1px solid var(--line);
        background: #f8fafc;
        color: #334155;
        white-space: nowrap;
      }
      .bug, .open { background: #fff1f2; color: var(--red); border-color: #fecdd3; }
      .status { background: #f0fdf4; color: var(--green); border-color: #bbf7d0; }
      .priority, .option { background: #fff7ed; color: var(--orange); border-color: #fed7aa; }
      .feature-badge { background: #ecfeff; color: #0e7490; border-color: #67e8f9; }
      .summary-cell { color: green; font-weight: 900; font-size: 15px; }
      .optional-col { display: none; }
      body.show-optional .optional-col { display: table-cell; }
      .toggle-optional, .filter-button, .ticket-view-button, .ticket-button {
        border: 1px solid #d8dee8;
        background: white;
        border-radius: 8px;
        padding: 8px 11px;
        font-weight: 900;
        cursor: pointer;
      }
      .toggle-optional { margin-bottom: 12px; }
      .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 14px; }
      .filter-field { display: grid; gap: 5px; min-width: 175px; }
      .filter-field label { font-size: 12px; font-weight: 900; color: #475569; }
      .filter-field select {
        height: 36px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: white;
        color: #172033;
        padding: 0 10px;
        font-weight: 800;
      }
      .filter-button { background: var(--blue); border-color: var(--blue); color: white; }
      .filter-button.reset { background: white; color: #172033; border-color: #cbd5e1; }
      .ticket-view-button {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
        box-shadow: 0 6px 14px rgba(37,84,214,.18);
      }
      .ticket-view-button:hover, .filter-button:hover { background: #1d4ed8; }
      .filter-button.reset:hover, .toggle-optional:hover { background: #eaf3ff; }
      .modal-backdrop, .evidence-viewer {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(15, 23, 42, .7);
        padding: 42px;
        overflow: auto;
      }
      .modal-backdrop.show, .evidence-viewer.show { display: block; }
      .ticket-modal {
        max-width: 1240px;
        margin: 0 auto;
        background: white;
        border-radius: 10px;
        border: 1px solid var(--line);
        box-shadow: 0 28px 70px rgba(15, 23, 42, .35);
        overflow: hidden;
      }
      .ticket-modal-header {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        justify-content: space-between;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
      }
      .ticket-modal-title { margin: 0; font-size: 24px; line-height: 1.2; }
      .ticket-modal-subtitle { margin-top: 8px; color: #667085; font-weight: 700; }
      .ticket-modal-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .ticket-button { background: var(--blue); border-color: var(--blue); color: #fff; white-space: nowrap; }
      .ticket-button.secondary { background: white; color: #172033; border-color: #d8dee8; }
      .export-md-button { border-color: #7c3aed !important; background: #f5f3ff !important; color: #5b21b6 !important; }
      .ticket-modal-body { padding: 20px 22px 24px; }
      .ticket-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
      .ticket-field { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fbfcfe; min-height: 70px; }
      .ticket-field.wide { grid-column: span 2; }
      .ticket-field.full { grid-column: 1 / -1; }
      .ticket-field.summary-main { grid-column: span 2; }
      .ticket-label { display: block; margin-bottom: 4px; color: #667085; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .03em; }
      .ticket-value { font-size: 14px; color: #172033; }
      .ticket-field[data-ticket-label="Summary"] .ticket-value { color: #15803d; font-size: 18px; font-weight: 900; line-height: 1.35; }
      .ticket-field[data-ticket-label="Expected Result"] { border-color: #86efac; background: #f0fdf4; }
      .ticket-field[data-ticket-label="Expected Result"] .ticket-label,
      .ticket-field[data-ticket-label="Expected Result"] .ticket-value { color: #15803d; }
      .ticket-field[data-ticket-label="Observed Result"] { border-color: #fecaca; background: #fff7f7; }
      .ticket-field[data-ticket-label="Observed Result"] .ticket-label,
      .ticket-field[data-ticket-label="Observed Result"] .ticket-value { color: #b91c1c; }
      .steps { margin: 0; padding-left: 0; list-style: none; }
      .steps li { padding: 3px 0; }
      .step-code { font-weight: 900; color: #dc2626; margin-right: 6px; }
      .ticket-edit-control {
        width: 100%;
        min-height: 92px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 9px 10px;
        font: inherit;
        color: #111827;
        resize: vertical;
      }
      .ticket-save-row { grid-column: 1 / -1; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
      .ticket-save-button { border: 1px solid #16a34a; background: #16a34a; color: white; border-radius: 8px; padding: 8px 14px; font-weight: 900; cursor: pointer; }
      .ticket-save-state { color: #15803d; font-weight: 900; }
      .resolution-picker { position: relative; }
      .resolution-picker-button {
        width: 100%;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        color: #111827;
        padding: 8px 10px;
        font: inherit;
        cursor: pointer;
      }
      .resolution-picker-button::after { content: "v"; color: #475569; }
      .resolution-picker-list {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 4px);
        z-index: 10000;
        margin: 0;
        padding: 4px;
        list-style: none;
        border: 1px solid #111827;
        border-radius: 8px;
        background: #f8fafc;
        box-shadow: 0 14px 32px rgba(15, 23, 42, .22);
      }
      .resolution-picker.open .resolution-picker-list { display: block; }
      .resolution-option { position: relative; padding: 8px 10px; border-radius: 6px; color: #111827; cursor: pointer; }
      .resolution-option:hover, .resolution-option.active { background: #dcfce7; color: #15803d; font-weight: 900; }
      .resolution-tooltip {
        display: none;
        position: absolute;
        left: calc(100% + 8px);
        top: 0;
        min-width: 230px;
        max-width: 320px;
        padding: 8px 10px;
        border: 1px solid #111827;
        border-radius: 8px;
        background: #f8fafc;
        color: #111827;
        font-size: 12px;
        line-height: 1.35;
        box-shadow: 0 10px 26px rgba(15, 23, 42, .2);
      }
      .resolution-option:hover .resolution-tooltip { display: block; }
      .evidence-section { margin-top: 18px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .evidence-section h3 { margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); background: #fbfcfe; }
      .evidence-grid { padding: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .evidence-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
        cursor: pointer;
      }
      .evidence-card:hover { border-color: #2454d6; box-shadow: 0 8px 18px rgba(15, 23, 42, .12); }
      .evidence-caption {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        font-weight: 900;
        color: #172033;
        min-height: 48px;
      }
      .evidence-image-shot { line-height: 0; background: #e2e8f0; }
      .evidence-image-shot img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 260px;
        object-fit: contain;
        object-position: top left;
        background: #fff;
      }
      .empty-note { grid-column: 1 / -1; padding: 14px; border: 1px dashed #cbd5e1; border-radius: 8px; color: #667085; background: #f8fafc; }
      .evidence-viewer-panel { max-width: 1200px; margin: 0 auto; }
      .evidence-viewer-panel .ticket-modal-header,
      .evidence-viewer-panel .ticket-modal-body {
        background: #fff;
      }
      .evidence-viewer-panel .ticket-modal-header {
        border-radius: 10px 10px 0 0;
        border: 1px solid var(--line);
        border-bottom: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 12px;
      }
      .evidence-viewer-panel .ticket-modal-body {
        border: 1px solid var(--line);
        border-top: 0;
        border-radius: 0 0 10px 10px;
      }
      .evidence-viewer-canvas {
        min-height: calc(100vh - 190px);
        background: #fff;
        border-radius: 8px;
        overflow: auto;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 18px;
      }
      .evidence-viewer-canvas img {
        display: block;
        max-width: 100%;
        max-height: calc(100vh - 230px);
        width: auto;
        height: auto;
        object-fit: contain;
        transform-origin: top center;
        border: 1px solid #cbd5e1;
        background: #fff;
      }
      #evidenceViewerTitle {
        font-size: 18px;
        line-height: 1.25;
        overflow-wrap: anywhere;
        word-break: normal;
      }
      #evidenceViewer .ticket-modal-actions {
        flex-wrap: nowrap;
        align-items: center;
      }
      #evidenceViewer .ticket-button {
        padding: 7px 10px;
        white-space: nowrap;
      }
      @media (max-width: 900px) {
        .page { padding: 14px 10px 34px; }
        .kpis, .ticket-grid, .evidence-grid { grid-template-columns: 1fr; }
        .ticket-field.wide, .ticket-field.summary-main { grid-column: 1; }
        .hero h1 { font-size: 26px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>TechNext Landing Page Bug Report</h1>
        <div class="kpis">
          <div class="kpi"><strong>6</strong><span>Total Bugs</span></div>
          <div class="kpi"><strong>6</strong><span>Open Bugs</span></div>
          <div class="kpi"><strong>0</strong><span>High Priority</span></div>
          <div class="kpi"><strong>25/05/2026</strong><span>Report Date</span></div>
        </div>
        <nav><a href="#bug">Bug Report</a></nav>
      </header>

      <section id="bug" data-report-section="bug-report">
        <div class="section-head">
          <h2>Bug Report Table</h2>
        </div>
        <div class="section-body">
          <div class="filter-bar" id="bugFilterBar">
            <div class="filter-field">
              <label for="bugFeatureFilter">Feature</label>
              <select id="bugFeatureFilter">
                <option value="">All</option>
                <option value="Lead Form Validation">Lead Form Validation</option>
                <option value="Header Navigation">Header Navigation</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="bugPriorityFilter">Priority</label>
              <select id="bugPriorityFilter">
                <option value="">All</option>
                <option value="P2 - High">P2 - High</option>
                <option value="P3 - Medium">P3 - Medium</option>
                <option value="P4 - Low">P4 - Low</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="bugStatusFilter">Status</label>
              <select id="bugStatusFilter">
                <option value="">All</option>
                <option value="New">New</option>
                <option value="Fixed">Fixed</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="bugDateFilter">Bug Date</label>
              <select id="bugDateFilter">
                <option value="">All</option>
                <option value="today">Today</option>
                <option value="last3">3 days ago</option>
                <option value="last7">One week ago</option>
              </select>
            </div>
            <button type="button" class="filter-button" id="applyBugFilter">Filter</button>
            <button type="button" class="filter-button reset" id="resetBugFilter">Reset</button>
          </div>

          <button class="toggle-optional" type="button" id="toggleOptional">Show all bug fields</button>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Summary</th>
                  <th>Steps to Reproduce</th>
                  <th>Priority</th>
                  <th>Feature</th>
                  <th class="optional-col">Build found</th>
                  <th class="optional-col">Reproducibility</th>
                  <th class="optional-col">Severity</th>
                  <th class="optional-col">Frequency</th>
                  <th class="optional-col">Keyword</th>
                  <th class="optional-col">Status</th>
                  <th class="optional-col">Resolution</th>
                  <th class="optional-col">Note</th>
                  <th class="optional-col">Suggested Fix</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody data-report-table="bug-report" id="bugTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div class="modal-backdrop" id="ticketModal" aria-hidden="true">
      <div class="ticket-modal" role="dialog" aria-modal="true">
        <div class="ticket-modal-header">
          <div>
            <h2 class="ticket-modal-title" id="modalTitle"></h2>
            <div class="ticket-modal-subtitle" id="modalSubtitle"></div>
          </div>
          <div class="ticket-modal-actions">
            <button type="button" class="ticket-button" id="exportTicketExcel">Export Excel</button>
            <button type="button" class="ticket-button secondary" id="closeModal">Close</button>
          </div>
        </div>
        <div class="ticket-modal-body">
          <div class="ticket-grid" id="ticketFields"></div>
          <div class="evidence-section">
            <h3>Step Evidence</h3>
            <div class="evidence-grid" id="evidenceGrid"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="evidence-viewer" id="evidenceViewer" aria-hidden="true">
      <div class="evidence-viewer-panel">
        <div class="ticket-modal-header">
          <h2 class="ticket-modal-title" id="evidenceViewerTitle">Step Evidence</h2>
          <div class="ticket-modal-actions">
            <button type="button" class="ticket-button secondary" id="prevEvidenceImage">&lt;</button>
            <button type="button" class="ticket-button secondary" id="nextEvidenceImage">&gt;</button>
            <button type="button" class="ticket-button secondary" id="zoomOutEvidence">Zoom out</button>
            <button type="button" class="ticket-button secondary" id="resetEvidenceZoom">Reset</button>
            <button type="button" class="ticket-button secondary" id="zoomInEvidence">Zoom in</button>
            <button type="button" class="ticket-button secondary" id="closeEvidenceViewer">Close</button>
          </div>
        </div>
        <div class="ticket-modal-body">
          <div class="evidence-viewer-canvas" id="evidenceViewerCanvas"></div>
        </div>
      </div>
    </div>

      });
      bugTableBody.addEventListener("click", event => {
        const button = event.target.closest("[data-view-ticket]");
        if (!button) return;
        openTicket(button.dataset.viewTicket);
      });
      fields.addEventListener("click", event => {
        const button = event.target.closest(".resolution-picker-button");
        if (button) {
          button.closest(".resolution-picker").classList.toggle("open");
          return;
        }
        const option = event.target.closest(".resolution-option");
        if (option) {
          const picker = option.closest(".resolution-picker");
          picker.dataset.selectedResolution = option.dataset.resolutionValue;
          picker.querySelector(".resolution-picker-button").textContent = optionByValue(option.dataset.resolutionValue).label;
          picker.querySelectorAll(".resolution-option").forEach(item => item.classList.toggle("active", item === option));
          picker.classList.remove("open");
          return;
        }
        if (event.target.closest("#saveTicketUpdate")) saveActiveTicket();
      });
      document.addEventListener("click", event => {
        if (!event.target.closest(".resolution-picker")) {
          fields.querySelectorAll(".resolution-picker.open").forEach(picker => picker.classList.remove("open"));
        }
      });
      closeModal.addEventListener("click", closeTicket);
      modal.addEventListener("click", event => { if (event.target === modal) closeTicket(); });
      exportExcel.addEventListener("click", () => download("technext_landing_page_bug_report.xls", exportExcelHtml(allTickets()), "application/vnd.ms-excel;charset=utf-8"));
      evidenceGrid.addEventListener("click", event => {
        const card = event.target.closest(".evidence-card");
        if (!card) return;
        openEvidenceViewer(Number(card.dataset.evidenceIndex));
      });
      closeEvidenceViewer.addEventListener("click", event => { event.stopPropagation(); evidenceViewer.classList.remove("show"); });
      evidenceViewer.addEventListener("click", event => { if (event.target === evidenceViewer) evidenceViewer.classList.remove("show"); });
      prevEvidenceImage.addEventListener("click", event => { event.stopPropagation(); showPrevEvidence(); });
      nextEvidenceImage.addEventListener("click", event => { event.stopPropagation(); showNextEvidence(); });
      zoomInEvidence.addEventListener("click", event => { event.stopPropagation(); evidenceZoom = Math.min(2.5, evidenceZoom + .2); applyEvidenceZoom(); });
      zoomOutEvidence.addEventListener("click", event => { event.stopPropagation(); evidenceZoom = Math.max(.5, evidenceZoom - .2); applyEvidenceZoom(); });
      resetEvidenceZoom.addEventListener("click", event => { event.stopPropagation(); evidenceZoom = 1; applyEvidenceZoom(); });
      document.addEventListener("keydown", event => {
        if (evidenceViewer.classList.contains("show") && (event.key === "ArrowLeft" || event.key === "<")) {
          event.preventDefault();
          showPrevEvidence();
          return;
        }
        if (evidenceViewer.classList.contains("show") && (event.key === "ArrowRight" || event.key === ">")) {
          event.preventDefault();
          showNextEvidence();
          return;
        }
        if (event.key === "Escape") {
          if (evidenceViewer.classList.contains("show")) evidenceViewer.classList.remove("show");
          else closeTicket();
        }
      });
    </script>
  </body>
</html>
